<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>筋トレ記録</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">今日のトレーニング</h1>
  </header>

  <main>
    <!-- 記録 -->
    <section id="view-today" class="view active">
      <div class="card">
        <label class="field">
          <span>日付</span>
          <input type="date" id="workout-date">
        </label>
        <div class="row">
          <input list="exercise-list" id="exercise-input" placeholder="種目名（例：ベンチプレス）" autocomplete="off">
          <button id="add-exercise" class="btn primary">追加</button>
        </div>
        <datalist id="exercise-list"></datalist>
      </div>

      <div id="today-entries"></div>
      <p id="today-empty" class="empty">種目を追加して記録を始めましょう 💪</p>
    </section>

    <!-- 履歴 -->
    <section id="view-history" class="view">
      <div id="history-list"></div>
      <p id="history-empty" class="empty">まだ記録がありません</p>
    </section>

    <!-- 分析 -->
    <section id="view-stats" class="view">
      <div class="card">
        <label class="field">
          <span>種目</span>
          <select id="stats-exercise"></select>
        </label>
        <div class="stat-grid">
          <div class="stat"><span class="stat-label">最大重量</span><span id="stat-max" class="stat-value">-</span></div>
          <div class="stat"><span class="stat-label">推定1RM</span><span id="stat-1rm" class="stat-value">-</span></div>
          <div class="stat"><span class="stat-label">実施回数</span><span id="stat-sessions" class="stat-value">-</span></div>
          <div class="stat"><span class="stat-label">総ボリューム</span><span id="stat-volume" class="stat-value">-</span></div>
        </div>
      </div>
      <div class="card">
        <h2 class="card-title">推定1RMの推移</h2>
        <canvas id="stats-chart" height="220"></canvas>
        <p id="chart-empty" class="empty small">データが2日分以上になるとグラフが表示されます</p>
      </div>
      <div class="card">
        <h2 class="card-title">直近7日間</h2>
        <div class="stat-grid">
          <div class="stat"><span class="stat-label">トレーニング日数</span><span id="week-days" class="stat-value">-</span></div>
          <div class="stat"><span class="stat-label">総セット数</span><span id="week-sets" class="stat-value">-</span></div>
        </div>
      </div>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <div class="card">
        <h2 class="card-title">レストタイマー</h2>
        <label class="field">
          <span>デフォルト秒数</span>
          <input type="number" id="rest-default" min="10" max="600" step="10">
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="rest-auto">
          <span>セット完了時に自動でタイマー開始</span>
        </label>
      </div>
      <div class="card">
        <h2 class="card-title">データ</h2>
        <p class="note">データはこの端末のブラウザ内にだけ保存されます。機種変更前などにはバックアップしてください。</p>
        <div class="row wrap">
          <button id="export-data" class="btn">バックアップを保存</button>
          <label class="btn">
            バックアップを読み込む
            <input type="file" id="import-data" accept="application/json" hidden>
          </label>
          <button id="clear-data" class="btn danger">全データ削除</button>
        </div>
      </div>
    </section>
  </main>

  <!-- レストタイマー -->
  <div id="timer" class="timer hidden">
    <button id="timer-minus" class="btn small">-15</button>
    <span id="timer-display">1:30</span>
    <button id="timer-plus" class="btn small">+15</button>
    <button id="timer-stop" class="btn small">停止</button>
  </div>

  <nav class="tabbar">
    <button data-view="today" class="tab active"><span>🏋️</span>記録</button>
    <button data-view="history" class="tab"><span>📅</span>履歴</button>
    <button data-view="stats" class="tab"><span>📈</span>分析</button>
    <button data-view="settings" class="tab"><span>⚙️</span>設定</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
